name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-16
          components: cargo, clippy, rustfmt
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy
      - name: clippy-nightly
        run: cargo +nightly clippy --features nightly
  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run loom test
      run: cargo test --lib -- tests::concurrent_allocs_loom
      env:
        RUSTFLAGS: "--cfg loom"
  test-nightly:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2025-09-16
    - name: Build
      run: cargo +nightly build --features nightly --verbose
    - name: Run tests
      run: cargo +nightly test --features nightly --verbose
